[project]
name = "website-auditor"
version = "0.1.0"
description = "Audits a website using a LangGraph pipeline that captures, analyses and reports on a page."
readme = "README.md"
authors = [
    { name = "thomasmitchellboom", email = "thomas.mitchell@boomworks.com.au" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langgraph>=1.2.18",
    "playwright>=1.64.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
